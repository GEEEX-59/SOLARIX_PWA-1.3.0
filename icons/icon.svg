<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Sun Rays Glow -->
  <g filter="url(#glow)" opacity="0.8">
    <line x1="256" y1="60" x2="256" y2="105" stroke="#fde047" stroke-width="12" stroke-linecap="round"/>
    <line x1="130" y1="112" x2="162" y2="144" stroke="#fde047" stroke-width="12" stroke-linecap="round"/>
    <line x1="382" y1="112" x2="350" y2="144" stroke="#fde047" stroke-width="12" stroke-linecap="round"/>
    <line x1="78" y1="236" x2="123" y2="236" stroke="#fde047" stroke-width="12" stroke-linecap="round"/>
    <line x1="434" y1="236" x2="389" y2="236" stroke="#fde047" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Glowing Sun -->
  <circle cx="256" cy="200" r="76" fill="url(#sunGrad)" filter="url(#glow)"/>

  <!-- Solar Panel Perspective Trapezoid -->
  <!-- Outer Frame -->
  <polygon points="120,410 392,410 432,260 80,260" fill="url(#panelGrad)" stroke="#c4b5fd" stroke-width="8" stroke-linejoin="round"/>

  <!-- Perspective Grid Lines -->
  <!-- Vertical Cell Dividers -->
  <line x1="172" y1="260" x2="200" y2="410" stroke="#7dd3fc" stroke-width="4" opacity="0.8"/>
  <line x1="256" y1="260" x2="256" y2="410" stroke="#38bdf8" stroke-width="5" opacity="0.9"/>
  <line x1="340" y1="260" x2="312" y2="410" stroke="#7dd3fc" stroke-width="4" opacity="0.8"/>

  <!-- Horizontal Cell Dividers -->
  <line x1="94" y1="310" x2="418" y2="310" stroke="#38bdf8" stroke-width="4" opacity="0.8"/>
  <line x1="107" y1="360" x2="405" y2="360" stroke="#38bdf8" stroke-width="4" opacity="0.8"/>

  <!-- Solar Energy Spark/Bolt Accent -->
  <path d="M 276 150 L 236 210 L 266 210 L 226 270 L 290 196 L 260 196 Z" fill="#ffffff" filter="url(#glow)" opacity="0.95"/>

  <!-- Solarix Accent Label at Bottom -->
  <text x="256" y="456" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ede9fe" letter-spacing="6" text-anchor="middle">SOLARIX</text>
</svg>
